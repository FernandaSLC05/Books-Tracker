# Porta da aplicacao (Railway/Render injetam a variavel PORT automaticamente)
server.port=${PORT:8080}

# Conexao com o Banco de Dados (compativel com MySQL e PostgreSQL via auto-deteccao da URL JDBC)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/books_tracker?serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Configuracoes do Hibernate (JPA)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Chave da Google Books API (configure via variavel de ambiente GOOGLE_BOOKS_API_KEY)
google.books.api-key=${GOOGLE_BOOKS_API_KEY:}

# Origens permitidas no CORS (em producao, informe a URL do front-end, ex: https://seu-site.vercel.app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}